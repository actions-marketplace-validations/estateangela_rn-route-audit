<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-label="rn-route-audit demo: reverse lookup and audit">
<style>text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13.5px;white-space:pre}.f{opacity:0}#f0{animation:a0 18.0s steps(1,end) infinite}@keyframes a0{0%,0.00%{opacity:0}0.00%,23.80%{opacity:1}25.00%,100%{opacity:0}}#f1{animation:a1 18.0s steps(1,end) infinite}@keyframes a1{0%,24.99%{opacity:0}25.00%,51.58%{opacity:1}52.78%,100%{opacity:0}}#f2{animation:a2 18.0s steps(1,end) infinite}@keyframes a2{0%,52.77%{opacity:0}52.78%,73.80%{opacity:1}75.00%,100%{opacity:0}}#f3{animation:a3 18.0s steps(1,end) infinite}@keyframes a3{0%,74.99%{opacity:0}75.00%,98.80%{opacity:1}100.00%,100%{opacity:0}}#cursor{animation:blink 1.1s steps(1,end) infinite}@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}</style>
<rect width="780" height="400" rx="10" fill="#11161c"/>
<rect width="780" height="30" rx="10" fill="#1b222b"/>
<rect y="22" width="780" height="8" fill="#1b222b"/>
<line x1="0" y1="30" x2="780" y2="30" stroke="#2a333f"/>
<circle cx="18" cy="15" r="4.5" fill="#2a333f"/>
<circle cx="36" cy="15" r="4.5" fill="#2a333f"/>
<circle cx="54" cy="15" r="4.5" fill="#2a333f"/>
<text x="390.0" y="19.5" text-anchor="middle" fill="#7c8a99" font-size="11">rn-route-audit</text>
<g class="f" id="f0"><text x="22" y="56" fill="#5fb3a1" font-weight="600">$</text><text x="38" y="56" fill="#d7dee7">rn-route-audit lookup --app ./my-app \</text><text x="38" y="76" fill="#d7dee7">    --i18n locale/en.json "welcome   back!!"</text><text x="22" y="116" fill="#7c8a99"># typo, double space, extra punctuation</text></g>
<g class="f" id="f1"><text x="22" y="56" fill="#5fb3a1" font-weight="600">$</text><text x="38" y="56" fill="#7c8a99">rn-route-audit lookup … "welcome   back!!"</text><text x="22" y="96" fill="#b48ead" font-weight="600">[normalized]</text><text x="38" y="116" fill="#52c0a9" font-weight="600">Main/Home</text><text x="54" y="136" fill="#7c8a99">key   home.greeting</text><text x="54" y="156" fill="#d7dee7">text  Welcome back</text><text x="54" y="176" fill="#6aa9d8">file  src/container/HomeScreen.tsx</text><text x="316" y="176" fill="#52c0a9">(mounted)</text></g>
<g class="f" id="f2"><text x="22" y="56" fill="#5fb3a1" font-weight="600">$</text><text x="38" y="56" fill="#d7dee7">rn-route-audit audit --app ./BlueWallet --src-dir .</text><text x="22" y="96" fill="#7c8a99"># a real open-source app, never seen before</text></g>
<g class="f" id="f3"><text x="22" y="56" fill="#5fb3a1" font-weight="600">$</text><text x="38" y="56" fill="#7c8a99">rn-route-audit audit --app ./BlueWallet --src-dir .</text><text x="22" y="96" fill="#d7dee7" font-weight="600">92 routes</text><text x="38" y="116" fill="#7c8a99">mounted      </text><text x="150" y="116" fill="#52c0a9" font-weight="600">91</text><text x="38" y="136" fill="#7c8a99">conditional  </text><text x="150" y="136" fill="#d79f4e" font-weight="600">0</text><text x="38" y="156" fill="#7c8a99">unresolved   </text><text x="150" y="156" fill="#dd8b82" font-weight="600">1</text><text x="38" y="176" fill="#7c8a99">unmounted    </text><text x="150" y="176" fill="#7c8a99" font-weight="600">0</text><text x="22" y="200" fill="#6aa9d8">written: routes.json</text><text x="79" y="220" fill="#6aa9d8">routes.csv</text></g>
<rect id="cursor" x="22" y="364" width="8" height="15" fill="#5fb3a1" opacity="0.9"/>
</svg>