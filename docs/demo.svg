<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" width="640" height="278" role="img" aria-label="rn-route-audit: reverse lookup finds the route behind a sentence; audit runs against a real open-source app">
<style>text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:13.5px;white-space:pre}.f{opacity:0}#f0{animation:a0 18.0s steps(1,end) infinite}@keyframes a0{0%{opacity:0}0.00%{opacity:1}25.00%{opacity:0}100%{opacity:0}}#f1{animation:a1 18.0s steps(1,end) infinite}@keyframes a1{0%{opacity:0}25.00%{opacity:1}52.78%{opacity:0}100%{opacity:0}}#f2{animation:a2 18.0s steps(1,end) infinite}@keyframes a2{0%{opacity:0}52.78%{opacity:1}75.00%{opacity:0}100%{opacity:0}}#f3{animation:a3 18.0s steps(1,end) infinite}@keyframes a3{0%{opacity:0}75.00%{opacity:1}100.00%{opacity:0}100%{opacity:0}}#cur{animation:bl 1.1s steps(1,end) infinite}@keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}</style>
<rect width="640" height="278" rx="10" fill="#11161c"/>
<path d="M0 10a10 10 0 0 1 10-10h620a10 10 0 0 1 10 10v20H0z" fill="#1b222b"/>
<line x1="0" y1="30" x2="640" y2="30" stroke="#2a333f"/>
<circle cx="18" cy="15" r="4.5" fill="#2a333f"/>
<circle cx="36" cy="15" r="4.5" fill="#2a333f"/>
<circle cx="54" cy="15" r="4.5" fill="#2a333f"/>
<text x="320.0" y="19.5" text-anchor="middle" fill="#7c8a99" font-size="11">rn-route-audit</text>
<g class="f" id="f0"><text x="22" y="56"><tspan fill="#5fb3a1" font-weight="600">$ </tspan><tspan fill="#d7dee7">rn-route-audit lookup --app ./my-app \</tspan></text><text x="22" y="76"><tspan fill="#d7dee7">    --i18n locale/en.json "welcome   back!!"</tspan></text><text x="22" y="96"><tspan fill="#d7dee7"></tspan></text><text x="22" y="116"><tspan fill="#7c8a99"># typo, double space, extra punctuation</tspan></text></g>
<g class="f" id="f1"><text x="22" y="56"><tspan fill="#5fb3a1" font-weight="600">$ </tspan><tspan fill="#7c8a99">rn-route-audit lookup … "welcome   back!!"</tspan></text><text x="22" y="76"><tspan fill="#d7dee7"></tspan></text><text x="22" y="96"><tspan fill="#b48ead" font-weight="600">[normalized]</tspan></text><text x="38" y="116"><tspan fill="#52c0a9" font-weight="600">Main/Home</tspan></text><text x="54" y="136"><tspan fill="#7c8a99">key   </tspan><tspan fill="#7c8a99">home.greeting</tspan></text><text x="54" y="156"><tspan fill="#7c8a99">text  </tspan><tspan fill="#d7dee7">Welcome back</tspan></text><text x="54" y="176"><tspan fill="#7c8a99">file  </tspan><tspan fill="#6aa9d8">src/container/HomeScreen.tsx</tspan><tspan fill="#7c8a99">  </tspan><tspan fill="#52c0a9">(mounted)</tspan></text></g>
<g class="f" id="f2"><text x="22" y="56"><tspan fill="#5fb3a1" font-weight="600">$ </tspan><tspan fill="#d7dee7">rn-route-audit audit --app ./BlueWallet --src-dir .</tspan></text><text x="22" y="76"><tspan fill="#d7dee7"></tspan></text><text x="22" y="96"><tspan fill="#7c8a99"># a real open-source app, never seen before</tspan></text></g>
<g class="f" id="f3"><text x="22" y="56"><tspan fill="#5fb3a1" font-weight="600">$ </tspan><tspan fill="#7c8a99">rn-route-audit audit --app ./BlueWallet --src-dir .</tspan></text><text x="22" y="76"><tspan fill="#d7dee7"></tspan></text><text x="22" y="96"><tspan fill="#d7dee7" font-weight="600">92 routes</tspan></text><text x="38" y="116"><tspan fill="#7c8a99">mounted       </tspan><tspan fill="#52c0a9" font-weight="600">91</tspan></text><text x="38" y="136"><tspan fill="#7c8a99">conditional   </tspan><tspan fill="#d79f4e" font-weight="600">0</tspan></text><text x="38" y="156"><tspan fill="#7c8a99">unresolved    </tspan><tspan fill="#dd8b82" font-weight="600">1</tspan></text><text x="38" y="176"><tspan fill="#7c8a99">unmounted     </tspan><tspan fill="#7c8a99" font-weight="600">0</tspan></text><text x="22" y="196"><tspan fill="#d7dee7"></tspan></text><text x="22" y="216"><tspan fill="#7c8a99">written: </tspan><tspan fill="#6aa9d8">routes.json</tspan></text><text x="22" y="236"><tspan fill="#7c8a99">         </tspan><tspan fill="#6aa9d8">routes.csv</tspan></text></g>
<rect id="cur" x="22" y="248" width="8" height="15" fill="#5fb3a1" opacity="0.85"/>
