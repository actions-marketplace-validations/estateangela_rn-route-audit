name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Standard library only, so the matrix is about syntax support.
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  mcp:
    # A handshake over the real transport: a reply split across two lines or
    # an answered notification both look like "the server did not start".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Handshake over stdio
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_route","arguments":{"route":"Main/Notice"}}}' \
          | python3 -m rn_route_audit mcp --app tests/fixtures/sample-app \
              --i18n locale/en.json --router-file router/path.tsx > out.jsonl

          test "$(wc -l < out.jsonl)" = "3"        # 4 messages, one is a notification
          python3 - <<'PY'
          import json
          lines = [json.loads(l) for l in open("out.jsonl")]
          assert [m["id"] for m in lines] == [1, 2, 3], lines
          assert lines[1]["result"]["tools"], "no tools advertised"
          assert "conditional" in lines[2]["result"]["content"][0]["text"]
          assert open("out.jsonl").read().isascii(), "non-ASCII on the wire"
          print("handshake ok")
          PY

  self-test:
    # Proves the action itself works, using the fixture app as the target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: audit
        with:
          app: tests/fixtures/sample-app
          i18n: locale/en.json
      - name: Check outputs
        run: |
          echo "total=${{ steps.audit.outputs.total }}"
          echo "mounted=${{ steps.audit.outputs.mounted }}"
          test "${{ steps.audit.outputs.total }}" = "8"
          test "${{ steps.audit.outputs.mounted }}" = "4"
          test "${{ steps.audit.outputs.conditional }}" = "1"
          test "${{ steps.audit.outputs.unmounted }}" = "2"
          test "${{ steps.audit.outputs.has-changes }}" = "false"

      # Proves the PR-comment path: rename a route, re-run against the first
      # result as baseline, and expect exactly one rename.
      - name: Self-test the diff path
        uses: ./
        id: diff
        with:
          app: tests/fixtures/literal-app
          router-file: __none__.tsx
          out-dir: _base_out
      - name: Rename a route and diff
        run: |
          sed -i 's/name="Settings"/name="Preferences"/' \
            tests/fixtures/literal-app/src/navigation/Root.tsx
      - uses: ./
        id: after
        with:
          app: tests/fixtures/literal-app
          router-file: __none__.tsx
          out-dir: _head_out
          baseline-json: _base_out/routes.json
          comment-file: route-changes.md
      - name: Check the diff
        run: |
          cat route-changes.md
          test "${{ steps.after.outputs.has-changes }}" = "true"
          test "${{ steps.after.outputs.renamed }}" = "1"
          test "${{ steps.after.outputs.added }}" = "0"
          grep -q "Settings. . .Preferences" route-changes.md
